[project]
name = "local-genai-mcp"
version = "0.1.0"
description = "MCP server that lets Claude Code use local generative AI (Ollama, Stable Diffusion WebUI Forge Neo)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "mcp>=2.2,<3",
    "httpx>=0.28",
    "pillow>=11",
]

[project.scripts]
local-genai-mcp = "local_genai_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_genai_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
